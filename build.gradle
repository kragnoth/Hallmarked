plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// QA harness: a separate test mod (never in the release jar) run on a headless dedicated server.
sourceSets {
    qa {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
configurations {
    qaImplementation.extendsFrom(implementation)
    qaCompileOnly.extendsFrom(compileOnly)
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
        }
        qaServer {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('run-qa')
            sourceSet = sourceSets.qa
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        hallmarked_qa {
            sourceSet(sourceSets.qa)
        }
    }
}

repositories {
    maven { name = 'Curios'; url = 'https://maven.theillusivec4.top/' }
    maven { name = 'JEI'; url = 'https://maven.blamejared.com/' }
}

dependencies {
    // Soft dependency: only the API is needed at compile time; Curios is optional at runtime.
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    // Optional: JEI integration (plugin is only loaded when JEI is present).
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
// After each jar build, bump the last number in gradle.properties (1.20.3 -> 1.20.4)
tasks.named('jar') {
    doLast {
        def parts = mod_version.tokenize('.')
        parts[-1] = (parts[-1].toInteger() + 1).toString()
        def f = file('gradle.properties')
        f.text = f.text.replaceFirst(/(?m)^mod_version=.*$/, "mod_version=${parts.join('.')}")
    }
}

jar {
    from('LICENSE') { rename { "LICENSE_${mod_id}" } }
}

// The QA run loads both mods (declared after the mods block exists).
neoForge.runs.named('qaServer').configure { it.loadedMods = [neoForge.mods.getByName(mod_id), neoForge.mods.getByName('hallmarked_qa')] }
